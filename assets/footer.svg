      <stop offset="0" stop-color="#04060C"/>
      <stop offset="0.5" stop-color="#0A0A10"/>
      <stop offset="1" stop-color="#170707"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5C542" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#F5C542" stop-opacity="0.8"/>
      <stop offset="0.8" stop-color="#C1121F" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#C1121F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#C9F7FF"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
