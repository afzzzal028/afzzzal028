  <g transform="translate(86,50) scale(0.5)" opacity="0.35">
    <path d="M0,18 C-6,18 -12,14 -22,15 C-34,16 -42,10 -52,9 C-47,15 -46,21 -38,25 C-46,27 -52,26 -58,29 C-47,32 -38,38 -28,36 C-20,35 -12,40 -6,47 C-4,40 -2,36 0,36 C2,36 4,40 6,47 C12,40 20,35 28,36 C38,38 47,32 58,29 C52,26 46,27 38,25 C46,21 47,15 52,9 C42,10 34,16 22,15 C12,14 6,18 0,18 Z" fill="#F5C542"/>
  </g>

  <g transform="translate(1114,70)">
    <circle r="34" fill="url(#core)" opacity="0.4"/>
    <circle r="22" fill="none" stroke="#9BE7FF" stroke-opacity="0.7" stroke-width="4" stroke-dasharray="1.5 6"/>
    <circle r="14" fill="none" stroke="#F5C542" stroke-opacity="0.5" stroke-width="1"/>
    <circle r="9" fill="#EAFBFF"/>
