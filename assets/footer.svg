  <text x="600" y="64" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="2.5" fill="#C3CFE2">WHY DO WE FALL? SO WE CAN LEARN TO PICK OURSELVES UP.</text>
  <text x="600" y="92" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.5" fill="#F5C542" opacity="0.85">— ALFRED PENNYWORTH</text>
</svg>
